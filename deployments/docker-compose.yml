version: "3.9"

services:
  # ─── API Gateway ──────────────────────────────────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"   # Gateway traffic
      - "9090:9090"   # Prometheus metrics — do NOT expose to internet
    volumes:
      # Mount config as read-only. Edit gateway.yaml → hot reload picks it up.
      - ../configs/gateway.yaml:/etc/gateway/gateway.yaml:ro
    environment:
      # Inject secrets via environment — never hardcode in config files.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    depends_on:
      - user-service
      - order-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── Mock Upstream Services ───────────────────────────────────────────────
  # These simulate your real backend services in local development.
  user-service:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./mock/user-service.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  order-service:
    image: nginx:alpine
    ports:
      - "9001:80"
    volumes:
      - ./mock/order-service.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ─── Prometheus (scrapes gateway metrics) ─────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped

networks:
  default:
    name: api-gateway-network
